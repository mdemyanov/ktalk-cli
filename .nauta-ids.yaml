# .nauta-ids.yaml — реестр пространств имён идентификаторов пакета ktalk-mcp (ADR-021,
# схема унаследована из ADR-038 плагина nauta). Читатель — `scripts/id-check.sh`, входит в
# payload и подключён к `scripts/check.sh --full` (см. `.nauta-scripts-basis.yaml`).
#
# Заведён не провижинингом `/nauta:init` (контур этого дерева старше файла — ADR-001, гейты
# nauta включены до появления `id-check.sh` в поставке 0.26.0), а решением ADR-021 при
# принятии пары «Требование → openspec/specs/<capability>/spec.md». Значения ниже — НЕ копия
# шаблона плагина: они отражают фактический корпус этого дерева на дату записи (ADR-021).
#
# Пространства `res`/`ac`/`decision-clause` из шаблона плагина НЕ заведены здесь осознанно —
# это не пробел, а несовпадение формы:
#   - исследования (`content/10-domain/research/*.md`) не несут суффикс `(RES-NNN)` в H1 —
#     номер RES присваивается в прозе (постановка, ссылки), не форматом `h1-suffix`;
#   - у требований нет собственной нумерации `AC-NNN` — нормативные пункты идут как
#     `### FR-N`/`### NFR-N` со сквозной нумерацией по всему корпусу требований, что не
#     покрыто ни одной формой `definition` этого реестра;
#   - решения ADR пакета не используют внутреннюю нумерацию `Д1`/`Д2` — пункты решения идут
#     обычным нумерованным списком («1. **Заголовок.** …»).
# Заводить эти три пространства с `populated: false` ради полноты по образцу плагина здесь не
# стали: пустая запись без предмета в РЕАЛЬНО эксплуатируемом (не только что заведённом)
# дереве не отличима от долга на первый взгляд читателя, а никакого долга нет — форма просто
# не применяется. Если корпус когда-нибудь примет любую из этих форм — запись заводится тем
# же коммитом, что и первое определение (тот же принцип, что у `adr` ниже).
namespaces:
  # `adr` — реальный, наполненный корпус: ADR-001…ADR-024 (highwater поднимается тем же
  # коммитом, что и новый файл решения — ручная дисциплина, `next-id.sh` в этом дереве не
  # заведён). Кладбище — `_index.md`: сегодня это markdown-таблица без списочных строк вида
  # «- ADR-NNN — отменён», поэтому парсер кладбища (ждёт `- `) не находит отменённых номеров.
  # Это верно фактическому состоянию (ни один ADR пакета не отменён) — не расхождение.
  - namespace: adr
    prefix: "ADR-"
    width: 3
    home: ["content/00-project/adr/ADR-*.md"]
    definition: filename-prefix
    scope: namespace
    allocation: allocated
    populated: true
    highwater: 26
    graveyard: content/00-project/adr/_index.md

  # `ops` — дом рунбуков DevOps (ADR-023 §3, issue #7: OPS-001 использовался в 10 местах
  # дерева как номерной идентификатор, но без дома и без гейта на коллизию будущего OPS-002).
  # Та же дисциплина, что `adr`: filename-prefix, highwater поднимается тем же коммитом, что
  # новый файл. Первый файл — `OPS-001-registry-migration-rollback.md` (задача DevOps,
  # issue #7) — `populated`/`highwater` подняты этим же коммитом (SA-013, решение 3).
  - namespace: ops
    prefix: "OPS-"
    width: 3
    home: ["content/70-operations/OPS-*.md"]
    definition: filename-prefix
    scope: namespace
    allocation: allocated
    populated: true
    highwater: 1
    graveyard: content/70-operations/_index.md

  # Дом контракта поведения требований (ADR-021, C15/C16 валидатора nauta 0.26.0). Пустой
  # `prefix` — по построению шаблона донора: ключ сценария выводится из текста заголовка
  # `#### Scenario: <имя>`, номера у него нет.
  #
  # `populated: false` — ПОСТОЯННЫЙ инвариант этой записи, не временное состояние «спек ещё
  # нет»: пустой `prefix` при `allocation: derived` структурно исключает `populated: true`
  # (`id-check.sh` §4.1a, унаследовано из ADR-038 донора) — пространству нечего нумеровать,
  # и с `populated: true` гейт читает запись как повреждённый реестр (`ERROR`), не как
  # «корпус пуст». Флаг не снимается ни при первой спеке, ни при восьмой, ни позже — так же,
  # как у донора: `ktalk-plugin/.nauta-ids.yaml` держит `scenario.populated: false` при
  # восьми существующих спеках в `openspec/specs/`. Найдено прогоном 2026-08-31 задачей
  # эпика, писавшей capability-спеки (не путать с историческим локальным `DEV-001` пакета —
  # `content/60-implementation/dev-001-host-config-and-store.md`, другой предмет):
  # `bash scripts/check.sh --full` c `populated: true` дал `ERROR: реестр повреждён…`;
  # текст ADR-021 §2 п.4 и companion-спеки §2 п.2 поправлен на этот факт следующим заходом
  # SA по этой находке (не путать с историческим локальным «SA-003» пакета —
  # `ktalk-plugin-spec.md`, другой предмет — `content/40-architecture/_index.md`).
  - namespace: scenario
    prefix: ""
    width: 0
    home: ["openspec/specs/*/spec.md"]
    definition: list-or-row-head
    scope: namespace
    allocation: derived
    populated: false

  # `external` + пустой `home`: идентификаторы задач стора эпика (вида «SA-NNN»/«DEV-NNN»,
  # присваиваемые стором, не этим деревом) не принадлежат документарному контуру пакета.
  # Конкретные номера здесь намеренно не приведены примером: у пакета своя, более старая
  # локальная последовательность `SA-NNN`/`DEV-NNN` (roadmap.md, `content/60-implementation/`)
  # с другим предметом на тех же номерах — пример из чужой нумерации читался бы как коллизия,
  # которой нет. Запись существует, чтобы гейт не принял идентификатор стора эпика в
  # шапке/тексте статьи `content/` за определение в домашнем пространстве этого дерева.
  - namespace: task
    prefix: ""
    width: 0
    home: []
    definition: list-or-row-head
    scope: namespace
    allocation: external
    populated: false
