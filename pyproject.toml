[project]
name = "ktalk-cli"
version = "3.0.2"
description = "CLI for accessing Kontur Talk (KTalk) recordings, transcripts and summaries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Maksim Demyanov", email = "mdemyanov@users.noreply.github.com" },
]
keywords = ["cli", "ktalk", "kontur", "recordings", "transcripts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Conferencing",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic-settings>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/mdemyanov/ktalk-cli"
Repository = "https://github.com/mdemyanov/ktalk-cli"
Issues = "https://github.com/mdemyanov/ktalk-cli/issues"

[project.scripts]
ktalk = "ktalk_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Состав sdist задан ЯВНО. Без этого блока hatchling кладёт в архив всё, что не
# исключено .gitignore, — и на PyPI уезжало бы дерево разработки: 121 файл
# content/ (ADR, роадмап, требования, журнал уроков), .beads/ со стором задач и
# его бэкапами, внутренние гейты scripts/ и .githooks/, конфигурация агентов
# .claude/.cursor/.codex/.agents и вендоренная спека API на 511 КБ. Проверено
# сборкой перед первой публикацией ktalk-cli: sdist весил 1,5 МБ.
# Публикация в индекс необратима (PEP 592: yank не удаляет), поэтому состав
# перечисляется белым списком, а не чёрным: новый внутренний каталог не должен
# попадать в архив по умолчанию.
# Пути ЯКОРЕНЫ ведущим слешем: шаблон `README.md` в gitignore-синтаксисе
# совпадает на любом уровне вложенности, и в архив попадал `.beads/README.md`
# из стора задач. Поймано сборкой, не рассуждением.
include = [
  "/src/",
  "/tests/",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
