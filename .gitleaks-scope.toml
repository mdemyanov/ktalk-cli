# .gitleaks-scope.toml — область гейта `secret-scan-tree` (ADR-062 Д2/Д3, DEV-088).
#
# Носитель НЕ называется `.gitleaks.toml`: это имя gitleaks подхватывает автоматически и в
# `gitleaks dir`, и в `gitleaks git --staged` (pre-commit хук) — один и тот же allowlist
# разоружил бы обе точки вызова разом (SEC-041 У1). Файл передаётся ТОЛЬКО явным
# `-c "$REPO_ROOT/.gitleaks-scope.toml"` из `scripts/check.sh` (--fast и
# --secret-scan-only). Хук (.githooks/pre-commit) его НЕ получает вовсе (см. комментарий
# scripts/check.sh:717-720) — сканирует только staged-diff и наши два файла ниже туда не
# попадают, потому что оба остаются как есть, не редактируются под этот коммит.
#
# Path-allowlist здесь ЗАПРЕЩЁН: `_secret_scan_verify_scope` (scripts/check.sh:665-671,
# Д6 ADR-062) валит гейт, если конфиг вычитает из области ОТСЛЕЖИВАЕМЫЙ файл — а оба файла
# ниже отслеживаются (`git ls-files` их печатает). Поэтому исключение — по РЕГУЛЯРНОМУ
# ВЫРАЖЕНИЮ НА САМО ЗНАЧЕНИЕ (allowlist.regexes сверяется с найденным секретом, не с
# путём), плюс [extend] useDefault = true, иначе конфиг заменил бы правила gitleaks вместо
# расширения их allowlist'ом.
#
# Обе находки проверены как ложные (замер 2026-08-31). Значения НАЗВАНЫ ПО РОЛИ И АДРЕСУ,
# а не воспроизведены строкой — и это не стилистика, а вынужденное:
#   * хук `.githooks/pre-commit` сканирует staged-diff БЕЗ этого конфига (намеренно: иначе
#     allowlist разоружил бы сам хук), поэтому файл исключений подчиняется тому же правилу,
#     от которого освобождает;
#   * первая редакция цитировала значение №2 вместе с его ключом, в форме `"<ключ>": "<значение>"`.
#     Именно ключ даёт правилу generic-api-key контекст присваивания — и гейт заблокировал
#     коммит на самом файле исключений, строка 22. Записи `regexes` ниже проходят потому, что
#     несут голое значение без ключа, то есть без контекста присваивания.
#
#   1. tests/test_token_file.py:118,161 — двадцатисимвольный литерал, который двумя строками
#      выше пишет сам же `write_token()`: фикстура теста, не секрет в обороте.
#   2. talk.public.api-api-2.json:3191,3343,3495 — значение токена постраничной выдачи в
#      примере ответа вендоренной OpenAPI-спеки. Это base64 от объекта с единственным полем
#      номера страницы; расшифровывается `base64 -d`, смотреть по адресу выше.
# Ни `tests/test_token_file.py`, ни `talk.public.api-api-2.json` этим файлом не правились.

[extend]
useDefault = true

[allowlist]
regexes = [
  # talk.public.api-api-2.json:3191,3343,3495 — nextPageToken-пример, base64('{"page":2}').
  '''eyJwYWdlIjoyfQ==''',
]
